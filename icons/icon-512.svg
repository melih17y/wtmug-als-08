          fill="url(#lock512)"/>
    <rect x="-90" y="-20" width="180" height="150" rx="24" fill="url(#lock512)"/>
    <circle cx="0" cy="45" r="22" fill="#1e40af"/>
    <rect x="-8" y="55" width="16" height="45" rx="8" fill="#1e40af"/>
